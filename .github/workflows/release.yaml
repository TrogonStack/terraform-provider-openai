name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository != 'TrogonStack/template-terraform-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release pull request or release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_PAT_RELEASE_PLEASE_ACTION }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run build
      - name: Load signing key
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # "Open Source Release Signing", by item ID so a retitle cannot break the reference
          GPG_PRIVATE_KEY: ${{ secrets.SECRETS_VAULT_ID }}/dejxtftpwbmjktkq4zk24uyvjq/GPG_PRIVATE_KEY
          GPG_FINGERPRINT: ${{ secrets.SECRETS_VAULT_ID }}/dejxtftpwbmjktkq4zk24uyvjq/GPG_FINGERPRINT
      - name: Import GPG key
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release
